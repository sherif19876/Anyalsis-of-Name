[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voter-name-analysis"
version = "0.1.0"
description = "Match voter records against curated name lists and aggregate by district."
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
